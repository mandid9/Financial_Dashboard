plugins {
    id 'com.android.application'
}

android {
    namespace 'com.finance.dashboard'
    compileSdk 34

    defaultConfig {
        applicationId "com.finance.dashboard"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    def releaseKeystore = System.getenv("FINANCE_KEYSTORE")
    def releaseStorePassword = System.getenv("FINANCE_KEYSTORE_PASSWORD")
    def releaseKeyPassword = System.getenv("FINANCE_KEY_PASSWORD")
    if (releaseKeystore && releaseStorePassword && releaseKeyPassword) {
        signingConfigs {
            release {
                storeFile file(releaseKeystore)
                storePassword releaseStorePassword
                keyAlias System.getenv("FINANCE_KEY_ALIAS") ?: "finance_key"
                keyPassword releaseKeyPassword
                v1SigningEnabled true
                v2SigningEnabled true
            }
        }
    }

    buildTypes {
        release {
            if (releaseKeystore && releaseStorePassword && releaseKeyPassword) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.biometric:biometric:1.2.0-alpha05'
    testImplementation 'junit:junit:4.13.2'
}

