<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180b2c" />
      <stop offset="50%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#0f1c3f" />
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007f" />
      <stop offset="50%" stop-color="#8a2be2" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#4ade80" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with rounded corners for adaptive icon -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="106" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4" />

  <!-- Glowing background ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#neonGrad)" stroke-width="12" filter="url(#glow)" opacity="0.4" />
  
  <!-- Outer Ring Shield -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#neonGrad)" stroke-width="8" />

  <!-- Modern Financial Symbol & Chart -->
  <!-- Rising Chart Bars -->
  <rect x="160" y="270" width="36" height="70" rx="8" fill="url(#neonGrad)" opacity="0.6" />
  <rect x="216" y="220" width="36" height="120" rx="8" fill="url(#neonGrad)" opacity="0.8" />
  <rect x="272" y="170" width="36" height="170" rx="8" fill="url(#neonGrad)" />
  <rect x="328" y="130" width="36" height="210" rx="8" fill="url(#barGrad)" />

  <!-- Trend Arrow -->
  <path d="M 150 280 Q 250 210, 350 120" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" filter="url(#glow)" />
  <polygon points="350,105 375,120 355,145" fill="#ffffff" filter="url(#glow)" />

  <!-- Currency Sparkle -->
  <circle cx="360" cy="120" r="10" fill="#22c55e" />
</svg>
